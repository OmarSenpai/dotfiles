# Starship Configuration - Box Style with Gruvbox Ribbons
# Place this file at: ~/.config/starship.toml

"$schema" = 'https://starship.rs/config-schema.json'

# Global format with box drawing and ribbons
format = """
[╭─ ](fb)[](fb)\
$os\
$username\
[](bg:noct fg:fb)\
$directory\
[](fg:noct bg:aqua)\
$git_branch\
$git_status\
[](fg:aqua bg:blue)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$scala\
$julia\
$ruby\
$swift\
$nodejs\
[](fg:blue bg:bg3)\
$docker_context\
$conda\
[](fg:bg3 bg:bg1)\
$time\
[](fg:bg1)
[╰─](bold cyan)$character"""

# Add a blank line between shell prompts
add_newline = true

# Gruvbox Dark Color Palette
palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
fg0 = '#fbf1c7'
bg1 = '#3c3836'
bg3 = '#665c54'
clear = '#dfdfdf'
blue = '#3960c4'
fb = '#6fb1d6'
aqua = '#63bfa8'
green = '#98971a'
orange = '#d65d0e'
purple = '#b16286'
noct = '#9f91ed'
sky = '#25c6cc'
red = '#cc241d'
yellow = '#d79921'

# OS Symbol
[os]
disabled = false
style = "bg:fb fg:fg:black"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

# Username
[username]
show_always = true
style_user = "bg:fb fg:fg:black"
style_root = "bg:fb fg:fg:black"
format = '[ $user ]($style)'

# Directory
[directory]
style = "fg:fg:black bg:noct"
format = "[ $path ]($style)"
truncation_length = 0
#truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# Git Branch
[git_branch]
symbol = ""
style = "bg:aqua"
format = '[[ $symbol $branch ](fg:fg:black bg:aqua)]($style)'

# Git Status
[git_status]
style = "bg:aqua"
format = '[[($all_status$ahead_behind )](fg:fg:black bg:aqua)]($style)'

# Programming Languages
[c]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:fg:clear bg:blue)]($style)'

[cpp]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:fg:clear bg:blue)]($style)'

[rust]
symbol = "󱘗"
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:fg:clear bg:blue)]($style)'

[golang]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:fg:clear bg:blue)]($style)'

[php]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:fg:clear bg:blue)]($style)'

[java]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:fg:clear bg:blue)]($style)'

[kotlin]
symbol = "󱈙"
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:fg:clear bg:blue)]($style)'

[haskell]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:fg:clear bg:blue)]($style)'

[python]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:fg:clear bg:blue)]($style)'

[scala]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:fg:clear bg:blue)]($style)'

[julia]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:fg:clear bg:blue)]($style)'

[zig]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:fg:clear bg:blue)]($style)'

[ruby]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:fg:clear bg:blue)]($style)'

[swift]
symbol = "󰛥"
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:fg:clear bg:blue)]($style)'

[nodejs]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:fg:clear bg:blue)]($style)'

# Docker & Environments
[docker_context]
symbol = ""
style = "bg:bg3"
format = '[[ $symbol( $context) ](fg:#83a598 bg:bg3)]($style)'

[conda]
style = "bg:bg3"
format = '[[ $symbol( $environment) ](fg:#83a598 bg:bg3)]($style)'

# Time
[time]
disabled = false
time_format = "%R"
style = "bg:bg1"
format = '[[  $time ](fg:fg:clear bg:bg1)]($style)'

# Line Break
[line_break]
disabled = false

# Character (prompt symbol)
[character]
disabled = false
success_symbol = '[❯](bold fg:aqua)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
vimcmd_replace_one_symbol = '[](bold fg:purple)'
vimcmd_replace_symbol = '[](bold fg:purple)'
vimcmd_visual_symbol = '[](bold fg:yellow)'

